<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signalynx Clone</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 480px; margin: auto; }
    h2 { text-align: center; color: #d4af37; }
    .section { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
    select, input, button { width: 100%; padding: 12px; border-radius: 6px; border: none; box-sizing: border-box; margin-bottom: 10px; background: #2a2a2a; color: #fff; }
    button.btn-submit { background: #d4af37; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .card-result { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #444; display: none; }
    .badge-buy { color: #00ff7f; font-size: 20px; font-weight: bold; }
    .badge-sell { color: #ff4500; font-size: 20px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    .box { background: #262626; padding: 10px; border-radius: 5px; font-size: 13px; }
  </style>
</head>
<body>

  <h2>Signalynx</h2>

  <div class="section">
    <label>01 MARKET</label>
    <select id="market" onchange="updatePairOptions()">
      <option value="Crypto">Crypto</option>
      <option value="Forex">Forex</option>
      <option value="Emas">Emas</option>
    </select>

    <label>02 INSTRUMEN / PAIR</label>
    <input type="text" id="pair" value="BTCUSDT">

    <label>03 GAYA TRADING</label>
    <select id="style">
      <option value="Scalping (M15)">Scalping (Tahan 15m - 3j)</option>
      <option value="Day Trade (H1)" selected>Day Trade (Tahan 2 - 12j)</option>
      <option value="Swing (H4)">Swing (Tahan 1 - 5 hari)</option>
    </select>

    <button class="btn-submit" onclick="generateSignal()">Buat signal</button>
  </div>

  <div id="result" class="card-result"></div>

  <script>
    function updatePairOptions() {
      const market = document.getElementById('market').value;
      const pairInput = document.getElementById('pair');
      if (market === 'Crypto') pairInput.value = 'BTCUSDT';
      else if (market === 'Forex') pairInput.value = 'EURUSD';
      else if (market === 'Emas') pairInput.value = 'XAUUSD';
    }

    async function generateSignal() {
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = "<p style='text-align:center;'>Memproses analisis pasar...</p>";

      const market = document.getElementById('market').value;
      const pair = document.getElementById('pair').value;
      const style = document.getElementById('style').value;

      try {
        const response = await fetch('/.netlify/functions/get-signal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ market, pair, style })
        });

        const data = await response.json();

        const badgeClass = data.signal === 'BUY' ? 'badge-buy' : 'badge-sell';

        resultDiv.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>${pair}</h3>
            <span class="${badgeClass}">${data.signal}</span>
          </div>
          <div class="grid">
            <div class="box"><b>ENTRY:</b><br>${data.entry}</div>
            <div class="box"><b>STOP LOSS:</b><br>${data.stopLoss}</div>
            <div class="box"><b>TAKE PROFIT 1:</b><br>${data.tp1}</div>
            <div class="box"><b>TAKE PROFIT 2:</b><br>${data.tp2}</div>
          </div>
          <p style="font-size:12px; color:#aaa;"><b>Risk/Reward:</b> ${data.rr} | <b>Tingkat Keyakinan:</b> ${data.confidence}</p>
          <hr style="border-color:#333;">
          <p style="font-size:13px; line-height:1.4;"><b>Ringkasan Teknikal:</b><br>${data.explanation}</p>
        `;
      } catch (err) {
        resultDiv.innerHTML = "<p style='color:red;'>Gagal mengambil sinyal. Periksa jaringan atau API Key.</p>";
      }
    }
  </script>
</body>
</html>
